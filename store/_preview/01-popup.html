<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>popup</title>
    <link rel="stylesheet" href="../../src/popup/popup.css" />
    <style>
      html, body {
        margin: 0;
        width: 1280px;
        height: 800px;
        background: #0b0b0b;
        overflow: hidden;
      }
      .stage {
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 42%, #1a1a1a 0%, #0b0b0b 62%);
      }
      .frame {
        width: 320px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        border: 1px solid #2a2a2a;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="frame">
        <main>
          <header>
            <img class="brand-icon" src="../../icons/icon128.png" alt="" />
            <div class="brand-text">
              <h1>Follow Check</h1>
              <p class="disclaimer">Unofficial. Not affiliated with Instagram or Meta.</p>
            </div>
            <span class="version">v1.6.0</span>
          </header>
          <section class="card">
            <p class="help">See who doesn't follow you back, who you don't follow back, and your mutuals.</p>
            <button class="primary" type="button">Open Follow Check</button>
          </section>
          <p class="note">Uses your logged-in Instagram tab: no passwords, and nothing is sent to the developer or saved.</p>
        </main>
      </div>
    </div>
  </body>
</html>
