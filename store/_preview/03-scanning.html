<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>scanning</title>
    <link rel="stylesheet" href="../../src/content/panel.css" />
    <style>
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #000; }
      .igfc-backdrop { opacity: 1; }
      .igfc-panel {
        opacity: 1;
        transform: translate(-50%, -50%);
        width: 980px;
        height: 740px;
        max-height: 740px;
      }
      .igfc-fab { display: none; }
      /* Static render: freeze the loader's animations. */
      #igfc-root * , #igfc-root *::before { animation: none !important; transition: none !important; }
    </style>
  </head>
  <body>
    <div id="igfc-root">
      <div class="igfc-backdrop igfc-open"></div>
      <div class="igfc-panel igfc-open">
        <div class="igfc-header">
          <div class="igfc-title-wrap"><h1 class="igfc-title">Follow Check for Instagram</h1></div>
          <button class="igfc-close" type="button">×</button>
        </div>
        <div class="igfc-progress"><i style="width: 87%"></i></div>
        <div class="igfc-body igfc-body-center">
          <div class="igfc-loader">
            <div class="igfc-loader-ring">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <defs>
                  <linearGradient id="igfc-ring-gradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#feda75"></stop>
                    <stop offset="35%" stop-color="#fa7e1e"></stop>
                    <stop offset="65%" stop-color="#d62976"></stop>
                    <stop offset="100%" stop-color="#962fbf"></stop>
                  </linearGradient>
                </defs>
                <circle class="igfc-ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="igfc-ring-arc" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="42.47"></circle>
              </svg>
              <img class="igfc-loader-logo" src="../../icons/icon128.png" alt="" />
              <span class="igfc-loader-pct">87%</span>
            </div>
            <h2 class="igfc-loading-title">Scanning your lists</h2>
            <p class="igfc-loader-sub">Loading followers and following…</p>
            <div class="igfc-load-meters">
              <div class="igfc-load-meter">
                <div class="igfc-load-meter-head"><span class="igfc-load-label">Followers</span><span class="igfc-load-tag">Loading</span></div>
                <div class="igfc-load-value"><strong>184</strong><small> / 259</small></div>
                <div class="igfc-load-bar"><i style="width: 71%"></i></div>
              </div>
              <div class="igfc-load-meter">
                <div class="igfc-load-meter-head"><span class="igfc-load-label">Following</span><span class="igfc-load-tag igfc-done">✓ Done</span></div>
                <div class="igfc-load-value"><strong>320</strong><small> / 320</small></div>
                <div class="igfc-load-bar"><i style="width: 100%"></i></div>
              </div>
            </div>
            <p class="igfc-loader-foot">Keep this tab open. Big lists can take a minute.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
