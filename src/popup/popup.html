<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Follow Check for Instagram</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="brand-icon" src="../../icons/icon128.png" alt="" />
        <div class="brand-text">
          <h1>Follow Check</h1>
          <p class="disclaimer">Unofficial. Not affiliated with Instagram or Meta.</p>
        </div>
        <span id="version" class="version"></span>
      </header>

      <section class="card">
        <p class="help">
          See who doesn't follow you back, who you don't follow back, and your
          mutuals.
        </p>
        <button id="openBtn" class="primary" type="button">Open Follow Check</button>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      </section>

      <p class="note">
        Uses your logged-in Instagram tab: no passwords, and nothing is sent to
        the developer or saved.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
