<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Follow Check for Instagram</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Follow Check</h1>
          <p>No passwords. Uses your logged-in Instagram tab.</p>
          <p class="disclaimer">Unofficial. Not affiliated with Instagram or Meta.</p>
        </div>
      </header>

      <section class="card">
        <p id="status">Checking current tab…</p>
        <div class="actions">
          <button id="openBtn" class="primary" type="button">
            Open panel
          </button>
          <button id="igBtn" type="button">Open Instagram</button>
        </div>
      </section>

      <figure class="logo">
        <img src="../../icons/icon256.png" alt="Follow Check for Instagram" />
      </figure>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
